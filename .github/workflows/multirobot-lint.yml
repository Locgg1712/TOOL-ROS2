name: multirobot-lint

# Static, no-ROS2-required scan for known ROS2 multi-robot sim-to-real pitfalls
# (see MULTIROBOT_LINT.md). Report-only: never runs --fix and commits back.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: pip install "mcp<3" pyyaml pytest

      - name: Unit tests (linter + server logic against a fake rclpy)
        run: python3 -m pytest test -q

      - name: Write full JSON report (never fails the job)
        if: always()
        run: python3 multirobot_lint.py . --format json --fail-on never --output multirobot-lint-report.json > /dev/null

      - name: Upload full JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multirobot-lint-report
          path: multirobot-lint-report.json
          if-no-files-found: ignore

      - name: Gate (annotations on the PR; fails on unresolved warning/error)
        run: python3 multirobot_lint.py . --format github
