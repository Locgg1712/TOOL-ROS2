name: multirobot-lint

# Static, no-ROS2-required scan for known ROS2 multi-robot sim-to-real
# pitfalls (see MULTIROBOT_LINT.md at the repo root). Runs on every PR and on
# pushes to main. Report-only by default — this workflow never runs --fix and
# commits back to the PR branch, so it can't silently change someone's code
# in CI; it only fails the check if unresolved warning/error findings remain.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run multirobot_lint (report only)
        id: lint
        run: |
          python3 multirobot_lint.py . --format text --output multirobot-lint-report.json

      - name: Upload full JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multirobot-lint-report
          path: multirobot-lint-report.json
          if-no-files-found: ignore
